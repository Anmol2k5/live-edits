<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Edits OBS Overlay</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important;font-family:system-ui,sans-serif}
    #stage{width:100%;height:100%;display:grid;place-items:center;pointer-events:none;position:relative}
    .effect{max-width:72%;max-height:72%;filter:drop-shadow(0 15px 25px #0008);animation:appear .23s cubic-bezier(.2,1.5,.3,1) both}
    .effect img,.effect video{width:100%;max-height:67vh;object-fit:contain;border-radius:14px}
    .effect--fullscreen{max-width:100%;max-height:100%;width:100%;height:100%}
    .effect--fullscreen img,.effect--fullscreen video{width:100%;height:100%;max-height:100%;object-fit:cover;border-radius:0}
    .effect--corner{position:absolute;max-width:34%;margin:0}
    .effect--top-left{top:3%;left:3%}.effect--top-right{top:3%;right:3%}
    .effect--bottom-left{bottom:3%;left:3%}.effect--bottom-right{bottom:3%;right:3%}
    .effect--leaving{animation:leave .25s ease both}
    #debug{position:absolute;bottom:12px;left:12px;padding:7px 10px;color:white;background:#13172bc9;border-radius:8px;font-size:13px}
    @keyframes appear{from{opacity:0;transform:translateY(25px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes leave{from{opacity:1}to{opacity:0;transform:scale(.92)}}
  </style>
</head>
<body>
  <main id="stage" aria-label="Stream effects"></main>
  <div id="debug" hidden>Connecting to relay...</div>
  <script src="/obs-player.js"></script>
  <script>
    const query=new URLSearchParams(location.search);
    const stage=document.getElementById("stage");
    const debug=document.getElementById("debug");
    debug.hidden=query.get("debug")!=="1";
    const sched=window.LiveEditsScheduler.createScheduler({maxQueue:6,dedupSize:200});
    // Scheduling key -> reaction payload, so finished items resolve back to
    // the media/position/trim settings the relay validated.
    const eventsByKey=new Map();
    // Layer wrapper -> scheduling key for coexist layers.
    const layers=new Map();
    const pendingStarts=new WeakMap();
    let playToken=0,lastSequence=0,lastBootId=null,mainKey=null;
    const status=message=>{debug.textContent=message};
    const tone=()=>{
      try{
        const ctx=new (window.AudioContext||window.webkitAudioContext)();
        const osc=ctx.createOscillator(),gain=ctx.createGain();
        osc.frequency.value=620;gain.gain.setValueAtTime(.065,ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.16);
        osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.17);
        osc.onended=()=>void ctx.close();
      }catch{status("Sound blocked; check OBS audio settings")}
    };
    const extOf=name=>(name?.split(".").pop()||"").toLowerCase();
    const positionClass=position=>{
      if(position==="fullscreen")return "effect--fullscreen";
      if(position==="top-left")return "effect--corner effect--top-left";
      if(position==="top-right")return "effect--corner effect--top-right";
      if(position==="bottom-left")return "effect--corner effect--bottom-left";
      if(position==="bottom-right")return "effect--corner effect--bottom-right";
      return "";
    };
    function release(wrapper){
      pendingStarts.get(wrapper)?.();
      try{
        const media=wrapper.querySelector("video,audio");
        if(media){try{media.pause()}catch{}media.removeAttribute("src");try{media.load()}catch{}}
        const imgs=wrapper.querySelectorAll("img");
        imgs.forEach(img=>img.removeAttribute("src"));
      }catch{}
      wrapper.remove();
    }
    function startMedia(media,event,wrapper){
      return new Promise(resolve=>{
        let settled=false,started=false,loadTimer;
        const finish=result=>{
          if(settled)return;
          settled=true;
          clearTimeout(loadTimer);
          media.removeEventListener("error",fail);
          media.removeEventListener("load",start);
          media.removeEventListener("loadedmetadata",start);
          pendingStarts.delete(wrapper);
          resolve(result);
        };
        const fail=()=>finish("failed");
        const start=async()=>{
          if(started||settled||!wrapper.isConnected)return;
          started=true;
          try{
            if(media.tagName==="VIDEO"||media.tagName==="AUDIO"){
              if(event.clipStartMs!=null)media.currentTime=event.clipStartMs/1000;
              await media.play();
              if(!wrapper.isConnected){try{media.pause()}catch{}return;}
            }else tone();
          }catch(err){if(wrapper.isConnected)status("Media playback blocked: "+err.message)}
          finish("ready");
        };
        pendingStarts.set(wrapper,()=>finish("cancelled"));
        media.addEventListener("error",fail,{once:true});
        if(media.tagName==="IMG"){
          if(media.complete)void start();
          else{
            media.addEventListener("load",start,{once:true});
            loadTimer=setTimeout(()=>finish("ready"),4000);
          }
        }else if(event.clipStartMs!=null&&media.readyState<1){
          media.addEventListener("loadedmetadata",start,{once:true});
        }else void start();
      });
    }
    function visibleDuration(event){
      return event.clipEndMs!=null
        ?Math.min(event.durationMs,Math.max(0,event.clipEndMs-(event.clipStartMs??0)))
        :event.durationMs;
    }
    function cleanupMain(){
      const main=stage.querySelector(":scope > .effect--main");
      if(main)release(main);
      for(const wrapper of layers.keys())release(wrapper);
      layers.clear();
    }
    function effectLike(event){
      return {
        id:event.effectId||event.templateId||event.moment,
        enabled:true,
        priority:typeof event.priority==="number"?event.priority:50,
        queue:event.queue||"replace",
        cooldownMs:typeof event.cooldownMs==="number"?event.cooldownMs:0,
      };
    }
    function triggerLike(event){
      return {
        id:String(event.triggerId??("seq:"+event.sequence)),
        dedupKey:event.dedupKey??undefined,
        expiresAt:event.expiresAt??undefined,
      };
    }
    async function play(event){
      const wrapper=document.createElement("div");
      wrapper.className=("effect effect--main "+positionClass(event.position)).trim();
      const extension=extOf(event.mediaFile);
      let media;
      if(["webm","mp4"].includes(extension)){
        media=document.createElement("video");
        media.src="/media/"+encodeURIComponent(event.mediaFile);
        media.playsInline=true;media.muted=event.muted===true;
        if(typeof event.volume==="number")media.volume=Math.min(1,Math.max(0,event.volume));
      }else if(["mp3","ogg","wav"].includes(extension)){
        media=document.createElement("audio");
        media.src="/media/"+encodeURIComponent(event.mediaFile);
        media.muted=event.muted===true;
        if(typeof event.volume==="number")media.volume=Math.min(1,Math.max(0,event.volume));
        const fallback=document.createElement("img");
        fallback.src="/templates/"+event.templateId+".png";fallback.alt=event.moment+" reaction";
        wrapper.append(fallback);
      }else{
        media=document.createElement("img");
        media.src=event.mediaFile?"/media/"+encodeURIComponent(event.mediaFile):"/templates/"+event.templateId+".png";
        media.alt=event.moment+" reaction";
      }
      wrapper.append(media);stage.append(wrapper);
      status("Playing "+event.moment);
      const started=await startMedia(media,event,wrapper);
      if(started!=="ready"){
        if(started==="failed")status("Media failed to load; skipped");
        release(wrapper);return started;
      }
      await new Promise(resolve=>setTimeout(resolve,visibleDuration(event)));
      if(event.clipEndMs!=null)try{media.pause?.()}catch{}
      wrapper.classList.add("effect--leaving");
      await new Promise(resolve=>setTimeout(resolve,240));
      release(wrapper);
      return "done";
    }
    async function playLayer(event,key){
      const wrapper=document.createElement("div");
      wrapper.className=("effect "+positionClass(event.position)).trim();
      layers.set(wrapper,key);
      try{
        const extension=extOf(event.mediaFile);
        let media;
        if(["webm","mp4"].includes(extension)){
          media=document.createElement("video");
          media.src="/media/"+encodeURIComponent(event.mediaFile);
          media.playsInline=true;media.muted=event.muted===true;
          if(typeof event.volume==="number")media.volume=Math.min(1,Math.max(0,event.volume));
        }else if(["mp3","ogg","wav"].includes(extension)){
          media=document.createElement("audio");
          media.src="/media/"+encodeURIComponent(event.mediaFile);
          media.muted=event.muted===true;
          if(typeof event.volume==="number")media.volume=Math.min(1,Math.max(0,event.volume));
          const fallback=document.createElement("img");
          fallback.src="/templates/"+event.templateId+".png";fallback.alt=event.moment+" reaction";
          wrapper.append(fallback);
        }else{
          media=document.createElement("img");
          media.src=event.mediaFile?"/media/"+encodeURIComponent(event.mediaFile):"/templates/"+event.templateId+".png";
          media.alt=event.moment+" reaction";
        }
        wrapper.append(media);stage.append(wrapper);
        status("Playing "+event.moment);
        const started=await startMedia(media,event,wrapper);
        if(started==="failed")status("Media failed to load; skipped");
        else if(started==="ready"){
          await new Promise(resolve=>setTimeout(resolve,visibleDuration(event)));
          if(event.clipEndMs!=null)try{media.pause?.()}catch{}
          wrapper.classList.add("effect--leaving");
          await new Promise(resolve=>setTimeout(resolve,240));
        }
      }finally{
        // Every exit — success, load failure, playback error, preemption —
        // releases the layer reference so the cap never wedges.
        release(wrapper);
        layers.delete(wrapper);
        eventsByKey.delete(key);
      }
    }
    async function runMain(key,token){
      const event=eventsByKey.get(key);
      if(!event){if(mainKey===key)mainKey=null;return;}
      mainKey=key;
      await play(event);
      eventsByKey.delete(key);
      if(mainKey===key)mainKey=null;
      if(token!==playToken)return;
      // Finished: promote the next waiter.
      const next=sched.finish(key);
      if(next){
        const following=eventsByKey.get(next.key);
        if(following)void runMain(next.key,token);
      }
    }
    function submit(event){
      const result=sched.submit(effectLike(event),triggerLike(event));
      if(result.action==="drop"){
        status(result.reason==="duplicate"?"Duplicate trigger ignored"
          :result.reason==="expired"?"Expired trigger ignored"
          :result.reason==="cooldown"?"Trigger cooling down"
          :result.reason==="queue-full"?"Playback queue full; trigger dropped"
          :"Trigger ignored (busy)");
        return;
      }
      if(result.key)eventsByKey.set(result.key,event);
      if(result.action==="replace"){
        // Interruption: invalidate the in-flight main play, tear down every
        // layer, drop stale waiters, and start the newcomer.
        playToken++;
        cleanupMain();
        sched.clearWaiting();
        eventsByKey.clear();
        if(result.key)eventsByKey.set(result.key,event);
        void runMain(result.key,playToken);
        return;
      }
      if(result.action==="start"&&(event.queue||"replace")==="coexist"&&mainKey!==null){
        if(layers.size>=3){status("Too many layers; trigger ignored");eventsByKey.delete(result.key);return;}
        void playLayer(event,result.key);
        return;
      }
      if(mainKey===null)void runMain(result.key,playToken);
    }
    function resync(bootId){
      // Relay restarted and its sequence reset: drop stale waiters so old
      // numbers cannot suppress the new generation.
      lastSequence=0;
      playToken++;
      cleanupMain();
      eventsByKey.clear();
      sched.reset();
      mainKey=null;
      status("Relay restarted; resynchronised");
      lastBootId=bootId;
    }
    // Diagnostics for automated tests (same-origin local page only).
    window.__liveEdits = {
      layers: () => layers.size,
      queued: () => sched.queueLength(),
      playing: () => mainKey !== null,
      idle: () => mainKey === null && layers.size === 0 && sched.queueLength() === 0,
    };
    const events=new EventSource("/events?token="+encodeURIComponent(query.get("token")||""));
    events.onopen=()=>status("OBS overlay connected");
    events.onerror=()=>status("OBS overlay reconnecting");
    events.addEventListener("hello",message=>{
      try{
        const hello=JSON.parse(message.data);
        if(lastBootId!==null&&hello.bootId!==lastBootId)resync(hello.bootId);
        else lastBootId=hello.bootId;
      }catch{status("Malformed hello event")}
    });
    events.addEventListener("reaction",message=>{
      try{
        const reaction=JSON.parse(message.data);
        if(lastBootId!==null&&reaction.bootId&&reaction.bootId!==lastBootId){resync(reaction.bootId);}
        if(reaction.sequence<=lastSequence)return;
        lastSequence=reaction.sequence;
        submit(reaction);
      }catch{status("Malformed reaction event")}
    });
  </script>
</body>
</html>
